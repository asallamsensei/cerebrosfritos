<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Tarea 5 — ¿Qué concepto aplica?</title>

  <style>
    :root {
      --bg-1: #10172a;
      --bg-2: #1c1033;

      --text: #f8f8ff;
      --muted: #c8c9df;

      --purple: #8b5cf6;
      --pink: #ec4899;
      --cyan: #06b6d4;
      --blue: #3b82f6;
      --green: #22c55e;
      --lime: #84cc16;
      --yellow: #eab308;
      --orange: #f97316;
      --red: #ef4444;
      --rose: #f43f5e;

      --panel: rgba(255, 255, 255, 0.08);
      --panel-strong: rgba(255, 255, 255, 0.13);
      --border: rgba(255, 255, 255, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 34px 16px 70px;

      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);

      background:
        radial-gradient(
          circle at 10% 10%,
          rgba(236, 72, 153, 0.30),
          transparent 28%
        ),
        radial-gradient(
          circle at 90% 15%,
          rgba(6, 182, 212, 0.28),
          transparent 30%
        ),
        radial-gradient(
          circle at 15% 90%,
          rgba(139, 92, 246, 0.28),
          transparent 30%
        ),
        radial-gradient(
          circle at 85% 90%,
          rgba(249, 115, 22, 0.22),
          transparent 28%
        ),
        linear-gradient(
          145deg,
          var(--bg-1),
          var(--bg-2)
        );
    }

    .wrap {
      width: min(1180px, 100%);
      margin: auto;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      margin: 0;

      font-size: clamp(30px, 5vw, 46px);
      line-height: 1.05;
      letter-spacing: -1px;
    }

    .subtitle {
      margin-top: 10px;

      color: var(--muted);
      font-size: 16px;
      line-height: 1.5;
    }

    .student {
      display: inline-block;

      margin-top: 14px;
      padding: 9px 15px;

      border-radius: 999px;

      background:
        linear-gradient(
          90deg,
          rgba(139, 92, 246, 0.28),
          rgba(236, 72, 153, 0.24),
          rgba(6, 182, 212, 0.22)
        );

      border: 1px solid rgba(255, 255, 255, 0.18);

      font-weight: 800;

      box-shadow:
        0 10px 28px rgba(0, 0, 0, 0.20);
    }

    .board {
      display: grid;

      grid-template-columns:
        minmax(0, 1.35fr)
        minmax(320px, 0.85fr);

      gap: 24px;

      align-items: start;
    }

    .panel {
      padding: 22px;

      border-radius: 26px;

      background:
        rgba(255, 255, 255, 0.07);

      border:
        1px solid var(--border);

      backdrop-filter: blur(12px);

      box-shadow:
        0 24px 60px rgba(0, 0, 0, 0.28);
    }

    .panel-title {
      margin-bottom: 18px;

      text-align: center;

      font-size: 18px;
      font-weight: 900;
    }

    .situaciones-grid {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 14px;
    }

    .conceptos-grid {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 14px;
    }

    .card-item {
      position: relative;

      min-height: 145px;

      padding: 18px;

      border-radius: 20px;

      border:
        1px solid rgba(255, 255, 255, 0.18);

      color: var(--text);

      cursor: pointer;

      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease,
        filter 0.18s ease;

      box-shadow:
        0 12px 30px rgba(0, 0, 0, 0.18);

      overflow: hidden;
    }

    .card-item::after {
      content: "";

      position: absolute;

      width: 96px;
      height: 96px;

      right: -30px;
      bottom: -36px;

      border-radius: 50%;

      background:
        rgba(255, 255, 255, 0.10);
    }

    .card-item:hover {
      transform:
        translateY(-4px)
        scale(1.01);

      box-shadow:
        0 18px 38px rgba(0, 0, 0, 0.24);

      filter: brightness(1.04);
    }

    .situation {
      text-align: left;
    }

    .situation:nth-child(1) {
      background:
        linear-gradient(
          145deg,
          rgba(59, 130, 246, 0.35),
          rgba(6, 182, 212, 0.24)
        );
    }

    .situation:nth-child(2) {
      background:
        linear-gradient(
          145deg,
          rgba(236, 72, 153, 0.34),
          rgba(139, 92, 246, 0.24)
        );
    }

    .situation:nth-child(3) {
      background:
        linear-gradient(
          145deg,
          rgba(249, 115, 22, 0.30),
          rgba(234, 179, 8, 0.22)
        );
    }

    .situation:nth-child(4) {
      background:
        linear-gradient(
          145deg,
          rgba(34, 197, 94, 0.28),
          rgba(6, 182, 212, 0.24)
        );
    }

    .situation:nth-child(5) {
      background:
        linear-gradient(
          145deg,
          rgba(139, 92, 246, 0.34),
          rgba(244, 63, 94, 0.24)
        );
    }

    .situation:nth-child(6) {
      background:
        linear-gradient(
          145deg,
          rgba(6, 182, 212, 0.30),
          rgba(59, 130, 246, 0.25)
        );
    }

    .situation:nth-child(7) {
      background:
        linear-gradient(
          145deg,
          rgba(132, 204, 22, 0.27),
          rgba(34, 197, 94, 0.22)
        );
    }

    .situation:nth-child(8) {
      background:
        linear-gradient(
          145deg,
          rgba(244, 63, 94, 0.30),
          rgba(249, 115, 22, 0.22)
        );
    }

    .situation:nth-child(9) {
      background:
        linear-gradient(
          145deg,
          rgba(234, 179, 8, 0.30),
          rgba(249, 115, 22, 0.22)
        );
    }

    .situation:nth-child(10) {
      background:
        linear-gradient(
          145deg,
          rgba(139, 92, 246, 0.30),
          rgba(59, 130, 246, 0.24)
        );
    }

    .concept {
      min-height: 105px;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;

      font-size: 17px;
      font-weight: 900;
    }

    .concept:nth-child(1) {
      background:
        linear-gradient(
          145deg,
          rgba(236, 72, 153, 0.34),
          rgba(244, 63, 94, 0.24)
        );
    }

    .concept:nth-child(2) {
      background:
        linear-gradient(
          145deg,
          rgba(6, 182, 212, 0.32),
          rgba(59, 130, 246, 0.24)
        );
    }

    .concept:nth-child(3) {
      background:
        linear-gradient(
          145deg,
          rgba(249, 115, 22, 0.30),
          rgba(234, 179, 8, 0.23)
        );
    }

    .concept:nth-child(4) {
      background:
        linear-gradient(
          145deg,
          rgba(139, 92, 246, 0.34),
          rgba(236, 72, 153, 0.23)
        );
    }

    .concept:nth-child(5) {
      background:
        linear-gradient(
          145deg,
          rgba(34, 197, 94, 0.30),
          rgba(132, 204, 22, 0.22)
        );
    }

    .concept:nth-child(6) {
      background:
        linear-gradient(
          145deg,
          rgba(59, 130, 246, 0.32),
          rgba(139, 92, 246, 0.24)
        );
    }

    .concept:nth-child(7) {
      background:
        linear-gradient(
          145deg,
          rgba(244, 63, 94, 0.31),
          rgba(249, 115, 22, 0.22)
        );
    }

    .concept:nth-child(8) {
      background:
        linear-gradient(
          145deg,
          rgba(6, 182, 212, 0.30),
          rgba(34, 197, 94, 0.22)
        );
    }

    .concept:nth-child(9) {
      background:
        linear-gradient(
          145deg,
          rgba(234, 179, 8, 0.30),
          rgba(249, 115, 22, 0.22)
        );
    }

    .concept:nth-child(10) {
      background:
        linear-gradient(
          145deg,
          rgba(139, 92, 246, 0.30),
          rgba(59, 130, 246, 0.24)
        );
    }

    .num {
      width: 34px;
      height: 34px;

      display: grid;
      place-items: center;

      margin-bottom: 12px;

      border-radius: 12px;

      background:
        rgba(255, 255, 255, 0.17);

      border:
        1px solid rgba(255, 255, 255, 0.18);

      font-weight: 900;
    }

    .text {
      position: relative;

      z-index: 1;

      font-size: 15px;
      line-height: 1.45;
    }

    .link-badge {
      position: absolute;

      top: 12px;
      right: 12px;

      z-index: 2;

      padding: 6px 9px;

      border-radius: 999px;

      background:
        rgba(255, 255, 255, 0.18);

      border:
        1px solid rgba(255, 255, 255, 0.20);

      font-size: 11px;
      font-weight: 900;
    }

    .selected {
      outline:
        3px solid rgba(255, 255, 255, 0.86);

      transform:
        translateY(-3px);
    }

    .matched {
      box-shadow:
        0 0 0 2px rgba(255, 255, 255, 0.12),
        0 18px 34px rgba(0, 0, 0, 0.22);
    }

    .correct {
      background:
        linear-gradient(
          145deg,
          rgba(34, 197, 94, 0.52),
          rgba(16, 185, 129, 0.30)
        ) !important;

      border-color:
        rgba(74, 222, 128, 0.92);

      box-shadow:
        0 0 0 2px rgba(34, 197, 94, 0.15),
        0 14px 34px rgba(34, 197, 94, 0.17);
    }

    .wrong {
      background:
        linear-gradient(
          145deg,
          rgba(239, 68, 68, 0.54),
          rgba(244, 63, 94, 0.30)
        ) !important;

      border-color:
        rgba(248, 113, 113, 0.94);

      box-shadow:
        0 0 0 2px rgba(239, 68, 68, 0.14),
        0 14px 34px rgba(239, 68, 68, 0.16);
    }

    .locked {
      cursor: default;
    }

    .actions {
      display: flex;
      justify-content: center;

      gap: 12px;

      flex-wrap: wrap;

      margin-top: 26px;
    }

    .btn {
      border: none;

      padding: 13px 21px;

      border-radius: 16px;

      color: white;

      font-weight: 900;

      cursor: pointer;

      transition:
        transform 0.18s ease,
        filter 0.18s ease;

      background:
        linear-gradient(
          90deg,
          var(--purple),
          var(--pink),
          var(--orange)
        );

      box-shadow:
        0 10px 28px rgba(139, 92, 246, 0.26);
    }

    .btn:hover {
      transform:
        translateY(-2px);

      filter:
        brightness(1.06);
    }

    .btn.secondary {
      background:
        linear-gradient(
          90deg,
          rgba(6, 182, 212, 0.32),
          rgba(59, 130, 246, 0.28)
        );

      border:
        1px solid var(--border);

      box-shadow:
        none;
    }

    .btn:disabled {
      opacity: 0.38;

      cursor: not-allowed;

      transform: none;
    }

    .feedback {
      display: none;

      width: min(620px, 100%);

      margin: 24px auto 0;

      padding: 20px;

      border-radius: 22px;

      text-align: center;

      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.13),
          rgba(255, 255, 255, 0.07)
        );

      border:
        1px solid var(--border);

      box-shadow:
        0 18px 40px rgba(0, 0, 0, 0.22);
    }

    .feedback.visible {
      display: block;
    }

    .score {
      font-size: 44px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .message {
      margin-top: 8px;

      color: var(--muted);

      line-height: 1.5;
    }

    @media (max-width: 900px) {
      .board {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 620px) {
      body {
        padding:
          26px
          12px
          50px;
      }

      .panel {
        padding: 15px;
      }

      .situaciones-grid,
      .conceptos-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .card-item {
        min-height: 135px;

        padding: 15px;
      }

      .concept {
        min-height: 95px;
      }

      .text {
        font-size: 14px;
      }
    }

    @media (max-width: 430px) {
      .situaciones-grid {
        grid-template-columns: 1fr;
      }

      .conceptos-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>

<body>

  <div class="wrap">

    <header>

      <h1>
        ¿Qué concepto aplica?
      </h1>

      <div class="subtitle">
        Relaciona cada situación con el concepto correcto.
      </div>

      <div class="student">
        ★ Leyla — Preparación ANLA / CNSC ★
      </div>

    </header>

    <div class="board">

      <section class="panel">

        <div class="panel-title">
          Situaciones
        </div>

        <div
          class="situaciones-grid"
          id="situaciones">
        </div>

      </section>

      <section class="panel">

        <div class="panel-title">
          Conceptos
        </div>

        <div
          class="conceptos-grid"
          id="conceptos">
        </div>

      </section>

    </div>

    <div class="actions">

      <button
        class="btn secondary"
        type="button"
        onclick="reiniciar()">
        Mezclar
      </button>

      <button
        class="btn"
        id="btnComprobar"
        type="button"
        onclick="comprobar()"
        disabled>
        Comprobar
      </button>

    </div>

    <div
      class="feedback"
      id="feedback">

      <div
        class="score"
        id="score">
        0/10
      </div>

      <div
        class="message"
        id="mensaje">
      </div>

    </div>

  </div>

  <script>

    const datos = [

      {
        id: 1,
        situacion:
          "Una empresa necesita tomar agua de un río para desarrollar su actividad productiva.",
        concepto:
          "Concesión"
      },

      {
        id: 2,
        situacion:
          "Se proyecta construir una estructura que ocupará el cauce de una corriente de agua.",
        concepto:
          "Ocupación"
      },

      {
        id: 3,
        situacion:
          "El titular desea ampliar el tiempo por el cual le fue otorgado el derecho de usar el agua.",
        concepto:
          "Prórroga"
      },

      {
        id: 4,
        situacion:
          "Una persona con interés legítimo considera que una concesión solicitada puede afectarla y quiere objetarla.",
        concepto:
          "Oposición"
      },

      {
        id: 5,
        situacion:
          "La autoridad necesita conocer la cantidad de agua que circula por una fuente.",
        concepto:
          "Aforo"
      },

      {
        id: 6,
        situacion:
          "Se requiere tomar físicamente el agua desde una fuente para conducirla hasta el lugar donde será utilizada.",
        concepto:
          "Captación"
      },

      {
        id: 7,
        situacion:
          "La autoridad realiza una diligencia en campo para verificar las condiciones relacionadas con una solicitud de concesión.",
        concepto:
          "Visita"
      },

      {
        id: 8,
        situacion:
          "El titular de una concesión pretende transferirla a otra persona.",
        concepto:
          "Traspaso"
      },

      {
        id: 9,
        situacion:
          "Se busca optimizar el consumo del recurso y promover acciones para ahorrar agua.",
        concepto:
          "PUEAA"
      },

      {
        id: 10,
        situacion:
          "La autoridad debe determinar qué uso del agua tiene preferencia frente a otros solicitantes.",
        concepto:
          "Prioridad"
      }

    ];

    let seleccionSituacion = null;

    let relaciones = {};

    let revisado = false;

    let ordenConceptos = [];


    const audioCtx =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();


    function tono(
      frecuencia,
      duracion,
      retraso = 0
    ) {

      try {

        const oscilador =
          audioCtx.createOscillator();

        const volumen =
          audioCtx.createGain();

        oscilador.connect(
          volumen
        );

        volumen.connect(
          audioCtx.destination
        );

        const inicio =
          audioCtx.currentTime +
          retraso;

        oscilador.type =
          "sine";

        oscilador.frequency.setValueAtTime(
          frecuencia,
          inicio
        );

        volumen.gain.setValueAtTime(
          0.0001,
          inicio
        );

        volumen.gain.exponentialRampToValueAtTime(
          0.12,
          inicio + 0.01
        );

        volumen.gain.exponentialRampToValueAtTime(
          0.0001,
          inicio + duracion
        );

        oscilador.start(
          inicio
        );

        oscilador.stop(
          inicio +
          duracion +
          0.03
        );

      } catch (error) {

        console.log(
          "Audio no disponible"
        );

      }

    }


    function sonidoCorrecto() {

      tono(
        620,
        0.10,
        0
      );

      tono(
        820,
        0.12,
        0.10
      );

      tono(
        1040,
        0.16,
        0.21
      );

    }


    function sonidoIncorrecto() {

      tono(
        260,
        0.13,
        0
      );

      tono(
        180,
        0.22,
        0.11
      );

    }


    function fisherYates(
      arreglo
    ) {

      const copia =
        [...arreglo];

      for (
        let i =
          copia.length - 1;
        i > 0;
        i--
      ) {

        const j =
          Math.floor(
            Math.random() *
            (i + 1)
          );

        [
          copia[i],
          copia[j]
        ] = [
          copia[j],
          copia[i]
        ];

      }

      return copia;

    }


    function prepararOrden() {

      ordenConceptos =
        fisherYates(

          datos.map(
            elemento =>
              elemento.concepto
          )

        );

    }


    function render() {

      const boxSituaciones =
        document.getElementById(
          "situaciones"
        );

      const boxConceptos =
        document.getElementById(
          "conceptos"
        );


      boxSituaciones.innerHTML =
        "";

      boxConceptos.innerHTML =
        "";


      datos.forEach(
        (
          dato,
          indice
        ) => {

          const boton =
            document.createElement(
              "button"
            );

          boton.type =
            "button";

          boton.className =
            "card-item situation";

          boton.dataset.id =
            dato.id;


          const relacion =
            relaciones[
              dato.id
            ];


          const etiqueta =
            relacion

            ? `
              <span class="link-badge">
                ${escapeHtml(relacion)}
              </span>
            `

            : "";


          boton.innerHTML =
            `

              ${etiqueta}

              <div class="num">
                ${indice + 1}
              </div>

              <div class="text">
                ${escapeHtml(dato.situacion)}
              </div>

            `;


          if (
            seleccionSituacion ===
            dato.id
          ) {

            boton.classList.add(
              "selected"
            );

          }


          if (
            relacion
          ) {

            boton.classList.add(
              "matched"
            );

          }


          if (
            revisado
          ) {

            if (
              relacion ===
              dato.concepto
            ) {

              boton.classList.add(
                "correct"
              );

            } else {

              boton.classList.add(
                "wrong"
              );

            }


            boton.classList.add(
              "locked"
            );

            boton.onclick =
              null;

          } else {

            boton.onclick =
              () => {

                seleccionarSituacion(
                  dato.id
                );

              };

          }


          boxSituaciones.appendChild(
            boton
          );

        }
      );


      ordenConceptos.forEach(
        concepto => {

          const boton =
            document.createElement(
              "button"
            );

          boton.type =
            "button";

          boton.className =
            "card-item concept";


          const usadoPor =
            Object.keys(
              relaciones
            ).find(
              id =>
                relaciones[id] ===
                concepto
            );


          boton.innerHTML =
            `

              <span>
                ${escapeHtml(concepto)}
              </span>

            `;

          if (
            usadoPor
          ) {

            boton.classList.add(
              "matched"
            );


            boton.innerHTML +=
              `

                <span class="link-badge">
                  #${usadoPor}
                </span>

              `;

          }

          if (
            revisado
          ) {

            const id =
              Number(
                usadoPor
              );


            if (
              id
            ) {

              const original =
                datos.find(
                  dato =>
                    dato.id ===
                    id
                );

              if (
                original.concepto ===
                concepto
              ) {

                boton.classList.add(
                  "correct"
                );

              } else {

                boton.classList.add(
                  "wrong"
                );

              }

            }

            boton.classList.add(
              "locked"
            );

            boton.onclick =
              null;

          } else {

            boton.onclick =
              () => {

                seleccionarConcepto(
                  concepto
                );

              };

          }

          boxConceptos.appendChild(
            boton
          );

        }
      );


      actualizarEstado();

    }


    function seleccionarSituacion(
      id
    ) {
      if (
        revisado
      ) {
        return;
      }


      seleccionSituacion =
        id;


      render();

    }


    function seleccionarConcepto(
      concepto
    ) {

      if (
        revisado ||
        seleccionSituacion === null
      ) {

        return;
      }

      Object.keys(
        relaciones
      ).forEach(
        id => {

          if (
            relaciones[id] ===
            concepto
          ) {

            delete relaciones[id];

          }

        }
      );

      relaciones[
        seleccionSituacion
      ] =
        concepto;


      seleccionSituacion =
        null;


      render();

    }


    function actualizarEstado() {

      const total =
        Object.keys(
          relaciones
        ).length;

      document.getElementById(
        "btnComprobar"
      ).disabled =
        total !==
        datos.length ||
        revisado;

    }


    function comprobar() {

      if (
        Object.keys(
          relaciones
        ).length !==
        datos.length
      ) {

        return;

      }

      revisado =
        true;


      let correctas =
        0;


      datos.forEach(
        dato => {

          if (
            relaciones[dato.id] ===
            dato.concepto
          ) {

            correctas++;

          }

        }
      );

      const porcentaje =
        Math.round(

          (
            correctas /
            datos.length
          ) *
          100

        );

      document
        .getElementById(
          "feedback"
        )
        .classList
        .add(
          "visible"
        );


      document.getElementById(
        "score"
      ).innerText =
        `${correctas}/${datos.length}`;


      let mensaje =
        "";


      if (
        porcentaje ===
        100
      ) {

        mensaje =
          "¡Excelente! Todas las relaciones son correctas.";

        sonidoCorrecto();

      } else if (
        porcentaje >=
        80
      ) {

        mensaje =
          "¡Muy bien! Revisa únicamente las tarjetas rojas.";

        sonidoIncorrecto();

      } else if (
        porcentaje >=
        60
      ) {

        mensaje =
          "Buen intento. Revisa las relaciones en rojo y vuelve a mezclar.";

        sonidoIncorrecto();

      } else {

        mensaje =
          "Hay varios conceptos por reforzar. Revisa las tarjetas rojas y vuelve a intentarlo.";

        sonidoIncorrecto();

      }


      document.getElementById(
        "mensaje"
      ).innerText =
        mensaje;


      render();

    }

    function reiniciar() {

      seleccionSituacion =
        null;

      relaciones =
        {};

      revisado =
        false;

      prepararOrden();

      document
        .getElementById(
          "feedback"
        )
        .classList
        .remove(
          "visible"
        );

      document.getElementById(
        "score"
      ).innerText =
        "0/10";

      document.getElementById(
        "mensaje"
      ).innerText =
        "";

      render();
    }

    function escapeHtml(
      texto
    ) {
      const div =
        document.createElement(
          "div"
        );

      div.textContent =
        String(
          texto ?? ""
        );


      return div.innerHTML;

    }


    prepararOrden();

    render();

  </script>

</body>
</html>
