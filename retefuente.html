<script id="offline-data" type="application/json">{"config":{"version":"1.0.0","schemaVersion":1,"title":"ReteFuente · Cuaderno de práctica","brand":"Asallam Sensei","period":"Septiembre de 2026","storageKey":"retefuente.cuaderno.v1","accessKey":"retefuente","uvt":52374,"iva":0.19,"reteiva":0.15,"topics":[{"id":"cuentas","label":"Cuentas"},{"id":"fundamentos","label":"Desde cero"},{"id":"iva","label":"IVA"},{"id":"retenciones","label":"Retenciones"},{"id":"asientos","label":"Asientos"},{"id":"criterio","label":"Criterio"},{"id":"cierre","label":"Cierre"}],"levels":[{"id":0,"label":"Desde cero"},{"id":1,"label":"Aplicación"},{"id":2,"label":"Taller"}],"notes":["Convención de este cuaderno: primero se causa la operación a crédito; el pago se muestra como un asiento posterior. Esto permite comparar comprador y vendedor.","Valores en pesos, redondeados al peso más cercano. El IVA de un total incluido se obtiene por diferencia entre total y base redondeada. No se redondean estas partidas a miles.","Los códigos son un mapa didáctico del PUC para comerciantes. Los nombres 2408-D y 2408-G identifican auxiliares didácticos de la misma cuenta 2408, no subcuentas oficiales.","Los servicios comunes conservan el IVA en un auxiliar por depurar. El taller no trae los ingresos completos del período para calcular su proporcionalidad definitiva.","La calidad de gran contribuyente, responsable del IVA y autorretenedor describe obligaciones diferentes. No se deduce una de otra.","La ruta trabaja retenciones ordinarias con los supuestos visibles de cada caso. No calcula autorretención especial de Sembremos sin actividad CIIU ni demás requisitos.","El anexo de cierre es un resumen didáctico de estas operaciones, no una declaración oficial ni un Formulario 350 listo para presentar."],"rules":[{"concept":"Servicios generales","rate":"4% declarante / 6% no declarante","base":"2 UVT = $104.748","note":"Revisar excepciones y rentas de trabajo de personas naturales.","sources":["bases","servicios","pn"]},{"concept":"Compras generales","rate":"2,5% declarante / 3,5% no declarante","base":"10 UVT = $523.740","note":"No trasladar esta regla a bienes con tratamiento especial.","sources":["vigencia","dur"]},{"concept":"Honorarios","rate":"11% persona jurídica; 10% PN en el escenario elegido","base":"Sin base mínima en el régimen ordinario","note":"PN: evaluar artículo 383 y condiciones del 11%; ser responsable del IVA no decide la tarifa.","sources":["honorarios","pn"]},{"concept":"Arrendamiento de inmuebles y transporte de pasajeros","rate":"3,5%","base":"10 UVT = $523.740","note":"Bases según régimen restablecido del Decreto 572; separar transporte de carga.","sources":["bases","vigencia"]},{"concept":"Arrendamiento de bienes muebles","rate":"4%","base":"Sin base mínima en este concepto","note":"El alquiler de un equipo no es una compra del equipo.","sources":["muebles"]},{"concept":"Compra de combustibles derivados del petróleo","rate":"0,1%","base":"Valor del pago o abono","note":"Aplicable a la compra a distribuidores mayoristas o minoristas.","sources":["combustible"]},{"concept":"ReteIVA general","rate":"15% del IVA","base":"Ver agente, operación y cuantía","note":"No es el 15% del total; existen excepciones, entre ellas ciertas operaciones entre agentes.","sources":["reteiva","agentes"]}]},"cuentas":[{"id":"1105","code":"1105","name":"Caja","classification":"Activo","nature":"D","description":"Efectivo que entra o sale de la empresa.","topic":"cuentas","level":0,"source":"puc","auxiliary":false},{"id":"1110","code":"1110","name":"Bancos","classification":"Activo","nature":"D","description":"Dinero disponible en cuentas bancarias.","topic":"cuentas","level":0,"source":"puc","auxiliary":false},{"id":"1305","code":"1305","name":"Clientes","classification":"Activo","nature":"D","description":"Derecho a cobrar una venta o un servicio a crédito.","topic":"cuentas","level":0,"source":"puc","auxiliary":false},{"id":"135515","code":"135515","name":"Retención en la fuente a favor","classification":"Activo","nature":"D","description":"Anticipo de renta: lo retenido al vendedor, no una pérdida.","topic":"cuentas","level":0,"source":"puc","auxiliary":false},{"id":"135517","code":"135517","name":"IVA retenido a favor","classification":"Activo","nature":"D","description":"Valor de la retención de IVA que le practicaron al vendedor.","topic":"cuentas","level":0,"source":"puc","auxiliary":false},{"id":"1435","code":"1435","name":"Mercancías no fabricadas por la empresa","classification":"Activo","nature":"D","description":"Bienes adquiridos para revender.","topic":"cuentas","level":0,"source":"puc","auxiliary":false},{"id":"152805","code":"152805","name":"Equipos de procesamiento de datos","classification":"Activo","nature":"D","description":"Computadores que se usan en el negocio.","topic":"cuentas","level":0,"source":"puc","auxiliary":false},{"id":"2205","code":"2205","name":"Proveedores nacionales","classification":"Pasivo","nature":"C","description":"Obligación por compras a proveedores del país.","topic":"cuentas","level":0,"source":"puc","auxiliary":false},{"id":"2335","code":"2335","name":"Costos y gastos por pagar","classification":"Pasivo","nature":"C","description":"Obligación causada por servicios y gastos pendientes de pago.","topic":"cuentas","level":0,"source":"puc","auxiliary":false},{"id":"236515","code":"236515","name":"Retención por honorarios","classification":"Pasivo","nature":"C","description":"Renta retenida a terceros por honorarios.","topic":"cuentas","level":0,"source":"puc","auxiliary":false},{"id":"236525","code":"236525","name":"Retención por servicios","classification":"Pasivo","nature":"C","description":"Renta retenida a terceros por servicios.","topic":"cuentas","level":0,"source":"puc","auxiliary":false},{"id":"236530","code":"236530","name":"Retención por arrendamientos","classification":"Pasivo","nature":"C","description":"Renta retenida a terceros por arrendamientos.","topic":"cuentas","level":0,"source":"puc","auxiliary":false},{"id":"236540","code":"236540","name":"Retención por compras","classification":"Pasivo","nature":"C","description":"Renta retenida por compras; se puede detallar por auxiliar.","topic":"cuentas","level":0,"source":"puc","auxiliary":false},{"id":"236575","code":"236575","name":"Autorretenciones","classification":"Pasivo","nature":"C","description":"Retención que el propio beneficiario causa a su cargo.","topic":"cuentas","level":0,"source":"puc","auxiliary":false},{"id":"2367","code":"2367","name":"Impuesto a las ventas retenido","classification":"Pasivo","nature":"C","description":"IVA retenido a terceros, pendiente de entregar a la DIAN.","topic":"cuentas","level":0,"source":"puc","auxiliary":false},{"id":"2408-D","code":"2408","name":"IVA de compras por depurar","classification":"Pasivo · auxiliar deudor","nature":"D","description":"Auxiliar de 2408 para IVA de compras. En gastos comunes, el descuento final exige depuración.","topic":"cuentas","level":0,"source":"puc","auxiliary":true},{"id":"2408-G","code":"2408","name":"IVA generado","classification":"Pasivo · auxiliar acreedor","nature":"C","description":"Auxiliar de 2408 para el IVA facturado al cliente.","topic":"cuentas","level":0,"source":"puc","auxiliary":true},{"id":"3115","code":"3115","name":"Aportes sociales","classification":"Patrimonio","nature":"C","description":"Aportes de los socios en una sociedad de cuotas.","topic":"cuentas","level":0,"source":"puc","auxiliary":false},{"id":"4135","code":"4135","name":"Comercio al por mayor y al por menor","classification":"Ingreso","nature":"C","description":"Ingreso por venta de mercancías; no incluye el IVA.","topic":"cuentas","level":0,"source":"puc","auxiliary":false},{"id":"4145","code":"4145","name":"Transporte, almacenamiento y comunicaciones","classification":"Ingreso","nature":"C","description":"Ingreso por prestación de transporte, con auxiliar según actividad.","topic":"cuentas","level":0,"source":"puc","auxiliary":false},{"id":"4155","code":"4155","name":"Actividades inmobiliarias, empresariales y de alquiler","classification":"Ingreso","nature":"C","description":"Ingreso por asesorías o alquiler, detallado por actividad.","topic":"cuentas","level":0,"source":"puc","auxiliary":false},{"id":"511025","code":"511025","name":"Asesoría jurídica","classification":"Gasto","nature":"D","description":"Honorarios por asesoría jurídica recibida.","topic":"cuentas","level":0,"source":"puc","auxiliary":false},{"id":"511035","code":"511035","name":"Asesoría técnica","classification":"Gasto","nature":"D","description":"Honorarios por asesoría técnica recibida.","topic":"cuentas","level":0,"source":"puc","auxiliary":false},{"id":"512010","code":"512010","name":"Arrendamiento de construcciones y edificaciones","classification":"Gasto","nature":"D","description":"Canon por uso de un local o edificio.","topic":"cuentas","level":0,"source":"puc","auxiliary":false},{"id":"512015","code":"512015","name":"Arrendamiento de maquinaria y equipo","classification":"Gasto","nature":"D","description":"Canon por uso de un equipo; no se adquiere el bien.","topic":"cuentas","level":0,"source":"puc","auxiliary":false},{"id":"513550","code":"513550","name":"Transporte, fletes y acarreos","classification":"Gasto","nature":"D","description":"Transporte contratado por la empresa.","topic":"cuentas","level":0,"source":"puc","auxiliary":false},{"id":"514515","code":"514515","name":"Mantenimiento de maquinaria y equipo","classification":"Gasto","nature":"D","description":"Conservación o reparación ordinaria del equipo.","topic":"cuentas","level":0,"source":"puc","auxiliary":false},{"id":"519535","code":"519535","name":"Combustibles y lubricantes","classification":"Gasto","nature":"D","description":"Combustible consumido en la operación.","topic":"cuentas","level":0,"source":"puc","auxiliary":false},{"id":"6135","code":"6135","name":"Costo de ventas de comercio","classification":"Costo","nature":"D","description":"Costo de la mercancía vendida; requiere conocer su costo contable.","topic":"cuentas","level":0,"source":"puc","auxiliary":false}],"preguntas":[{"id":"b001","topic":"fundamentos","level":0,"type":"choice","prompt":"¿Qué representa un activo?","options":[{"id":"ok","text":"Un recurso controlado por la empresa"},{"id":"w0","text":"Una obligación con terceros"},{"id":"w1","text":"Cualquier ingreso recibido"}],"answer":"ok","hint":"Piensa en caja, bancos o mercancía.","explanation":"Un activo es un recurso. Puede ser efectivo, un bien o un derecho a cobrar.","calculation":[],"sources":["puc"]},{"id":"b002","topic":"fundamentos","level":0,"type":"choice","prompt":"¿Qué representa un pasivo?","options":[{"id":"ok","text":"Una obligación presente"},{"id":"w0","text":"Una ganancia asegurada"},{"id":"w1","text":"Todo dinero que entra"}],"answer":"ok","hint":"Piensa en lo que la empresa debe.","explanation":"Proveedores y retenciones por pagar son obligaciones: se clasifican como pasivos.","calculation":[],"sources":["puc"]},{"id":"b003","topic":"fundamentos","level":0,"type":"choice","prompt":"¿Cuál es la ecuación contable básica?","options":[{"id":"ok","text":"Activo = Pasivo + Patrimonio"},{"id":"w0","text":"Activo = Ingresos + IVA"},{"id":"w1","text":"Patrimonio = Activo + Pasivo"}],"answer":"ok","hint":"Los recursos se financian con terceros y con recursos propios.","explanation":"El patrimonio es el valor residual: activo menos pasivo.","calculation":[],"sources":["puc"]},{"id":"b004","topic":"fundamentos","level":0,"type":"choice","prompt":"En una cuenta T, ¿qué lado es el debe?","options":[{"id":"ok","text":"El lado izquierdo"},{"id":"w0","text":"El lado derecho"},{"id":"w1","text":"Depende de si hubo ganancia"}],"answer":"ok","hint":"El nombre del lado nunca cambia.","explanation":"Debe es izquierda y haber es derecha. Eso no significa automáticamente entrada o salida de dinero.","calculation":[],"sources":["puc"]},{"id":"b005","topic":"fundamentos","level":0,"type":"choice","prompt":"¿Cómo aumenta normalmente un activo?","options":[{"id":"ok","text":"Con un débito"},{"id":"w0","text":"Con un crédito"},{"id":"w1","text":"Siempre con una retención"}],"answer":"ok","hint":"Observa qué pasa cuando entra dinero a caja.","explanation":"Los activos ordinarios aumentan al debe y disminuyen al haber; existen cuentas correctoras con dinámica distinta.","calculation":[],"sources":["puc"]},{"id":"b006","topic":"fundamentos","level":0,"type":"choice","prompt":"¿Cómo aumenta normalmente un pasivo?","options":[{"id":"ok","text":"Con un crédito"},{"id":"w0","text":"Con un débito"},{"id":"w1","text":"Solo cuando se paga"}],"answer":"ok","hint":"Una deuda nueva se ubica al haber.","explanation":"Al causar una obligación aumenta el pasivo; al pagarla se debita y disminuye.","calculation":[],"sources":["puc"]},{"id":"b007","topic":"fundamentos","level":0,"type":"choice","prompt":"¿Qué comprueba la partida doble?","options":[{"id":"ok","text":"Que el total del debe sea igual al total del haber"},{"id":"w0","text":"Que todas las cuentas tengan saldo cero"},{"id":"w1","text":"Que solo se usen dos cuentas"}],"answer":"ok","hint":"Un asiento puede tener más de dos cuentas.","explanation":"Cada operación conserva la igualdad de los importes debitados y acreditados. Cuadrar es necesario, pero también deben ser correctas las cuentas.","calculation":[],"sources":["puc"]},{"id":"b008","topic":"fundamentos","level":0,"type":"choice","prompt":"¿Comprar a crédito significa que ya salió dinero?","options":[{"id":"ok","text":"No: nace una obligación por pagar"},{"id":"w0","text":"Sí: siempre sale de bancos"},{"id":"w1","text":"No se registra hasta pagar"}],"answer":"ok","hint":"Separa causación y pago.","explanation":"La compra a crédito se registra con un pasivo. Cuando se paga, se cancela ese pasivo contra caja o bancos.","calculation":[],"sources":["puc"]},{"id":"b009","topic":"iva","level":0,"type":"choice","prompt":"¿El IVA que factura un vendedor es su ingreso por ventas?","options":[{"id":"ok","text":"No: se registra separado del ingreso"},{"id":"w0","text":"Sí: todo el total es ingreso"},{"id":"w1","text":"Solo si cobra en efectivo"}],"answer":"ok","hint":"El IVA se recauda para el Estado.","explanation":"El ingreso se reconoce por el valor antes de IVA; el impuesto generado se reconoce por separado.","calculation":[],"sources":["reteiva","prorrata"]},{"id":"b010","topic":"iva","level":1,"type":"choice","prompt":"Un total de $119.000 incluye IVA del 19%. ¿Cuál es la base?","options":[{"id":"ok","text":"$100.000"},{"id":"w0","text":"$96.390"},{"id":"w1","text":"$119.000"}],"answer":"ok","hint":"Divide entre 1,19.","explanation":"Si el IVA está incluido, el total representa el 119% de la base. Restar 19% al total produce un valor equivocado.","calculation":[],"sources":["reteiva","prorrata"]},{"id":"b011","topic":"iva","level":1,"type":"choice","prompt":"Una venta de $100.000 más IVA del 19% suma…","options":[{"id":"ok","text":"$119.000"},{"id":"w0","text":"$100.019"},{"id":"w1","text":"$81.000"}],"answer":"ok","hint":"Calcula primero el 19% de la base.","explanation":"IVA = $19.000. Total = base + IVA = $119.000.","calculation":[],"sources":["reteiva","prorrata"]},{"id":"b012","topic":"iva","level":1,"type":"choice","prompt":"Si el IVA facturado es $190.000, ¿cuánto es su reteIVA al 15%?","options":[{"id":"ok","text":"$28.500"},{"id":"w0","text":"$150.000"},{"id":"w1","text":"$190.000"}],"answer":"ok","hint":"El porcentaje se aplica al impuesto.","explanation":"ReteIVA = $190.000 × 15% = $28.500. La base de esta retención es el IVA, no la base de la factura.","calculation":[],"sources":["reteiva","prorrata"]},{"id":"b013","topic":"retenciones","level":0,"type":"choice","prompt":"¿Qué hace quien practica una retención?","options":[{"id":"ok","text":"Descuenta una parte del pago y la debe entregar a la DIAN"},{"id":"w0","text":"Se queda con una utilidad adicional"},{"id":"w1","text":"Elimina parte de la venta"}],"answer":"ok","hint":"Retener genera una obligación.","explanation":"Para el retenedor nace una cuenta por pagar al Estado. Para el beneficiario es un anticipo de su impuesto.","calculation":[],"sources":["bases","servicios","honorarios"]},{"id":"b014","topic":"retenciones","level":0,"type":"choice","prompt":"¿Ser responsable del IVA significa ser autorretenedor de renta?","options":[{"id":"ok","text":"No, son calidades distintas"},{"id":"w0","text":"Sí, siempre"},{"id":"w1","text":"Solo si la factura supera un millón"}],"answer":"ok","hint":"Cada calidad responde a una obligación diferente.","explanation":"Hay que revisar por separado IVA, calidad de agente retenedor y autorretención.","calculation":[],"sources":["bases","servicios","honorarios"]},{"id":"b015","topic":"retenciones","level":1,"type":"choice","prompt":"Compra: base $2.000.000. Retención de renta al 2,5%. ¿Cuánto se retiene?","options":[{"id":"ok","text":"$50.000"},{"id":"w0","text":"$500.000"},{"id":"w1","text":"$59.500"}],"answer":"ok","hint":"2,5% equivale a 0,025.","explanation":"La retención de renta de esta compra se calcula sobre la base sin IVA: $2.000.000 × 0,025.","calculation":[],"sources":["bases","servicios","honorarios"]},{"id":"b016","topic":"retenciones","level":1,"type":"choice","prompt":"Factura total $1.190.000; retefuente $25.000 y reteIVA $28.500. ¿Neto al proveedor?","options":[{"id":"ok","text":"$1.136.500"},{"id":"w0","text":"$1.243.500"},{"id":"w1","text":"$1.165.000"}],"answer":"ok","hint":"Resta ambas retenciones al total.","explanation":"Neto = $1.190.000 − $25.000 − $28.500 = $1.136.500. Los importes retenidos no se pagan al proveedor.","calculation":[],"sources":["bases","servicios","honorarios"]},{"id":"b017","topic":"retenciones","level":1,"type":"choice","prompt":"Honorarios pagados a una sociedad: tarifa ordinaria del ejercicio.","options":[{"id":"ok","text":"11%"},{"id":"w0","text":"4%"},{"id":"w1","text":"2,5%"}],"answer":"ok","hint":"Identifica primero el concepto y luego el beneficiario.","explanation":"Los honorarios a una persona jurídica se trabajan al 11%, salvo un tratamiento especial aplicable.","calculation":[],"sources":["bases","servicios","honorarios"]},{"id":"b018","topic":"retenciones","level":1,"type":"choice","prompt":"¿Basta saber que una persona natural es responsable del IVA para fijar su retefuente por honorarios?","options":[{"id":"ok","text":"No: faltan datos del régimen y del contrato"},{"id":"w0","text":"Sí: siempre es 11%"},{"id":"w1","text":"Sí: siempre es 4%"}],"answer":"ok","hint":"IVA y renta son análisis diferentes.","explanation":"Se deben evaluar la tabla del artículo 383 y, en el régimen ordinario, los supuestos del 10% o 11%.","calculation":[],"sources":["bases","servicios","honorarios"]},{"id":"b019","topic":"retenciones","level":1,"type":"choice","prompt":"¿La reteIVA general se practica entre dos grandes contribuyentes en la operación ordinaria del taller?","options":[{"id":"ok","text":"No, se aplica la excepción entre esos agentes"},{"id":"w0","text":"Sí, siempre al 15%"},{"id":"w1","text":"Sí, al 100%"}],"answer":"ok","hint":"Comprueba las calidades de ambos.","explanation":"El parágrafo 1 del artículo 437-2 excluye de esta retención las operaciones entre los agentes allí previstos.","calculation":[],"sources":["bases","servicios","honorarios"]},{"id":"b020","topic":"iva","level":1,"type":"choice","prompt":"Un proveedor no responsable del IVA no factura IVA. ¿Se inventa un IVA para retenerlo?","options":[{"id":"ok","text":"No"},{"id":"w0","text":"Sí: 19% y luego 15%"},{"id":"w1","text":"Sí: 15% del precio"}],"answer":"ok","hint":"No hay impuesto facturado que retener en ese escenario.","explanation":"En la operación ordinaria descrita no se calcula IVA ni reteIVA por el solo hecho de comprar a un no responsable.","calculation":[],"sources":["reteiva","prorrata"]},{"id":"b021","topic":"criterio","level":2,"type":"choice","prompt":"Un descuento depende de pagar antes de 8 días. Al registrar la factura inicial…","options":[{"id":"ok","text":"No se resta automáticamente del valor ni del IVA"},{"id":"w0","text":"Se reduce todo un 10% de inmediato"},{"id":"w1","text":"Se elimina la retención"}],"answer":"ok","hint":"Todavía no se ha cumplido la condición.","explanation":"El descuento condicionado requiere un análisis separado. Para IVA, el pronto pago condicionado no reduce la base gravable.","calculation":[],"sources":["descuento","prorrata","pn"]},{"id":"b022","topic":"criterio","level":2,"type":"choice","prompt":"Sembremos vende bienes gravados, exentos y excluidos. ¿Todo IVA de gastos comunes es descontable?","options":[{"id":"ok","text":"No: hay que revisar imputación y proporcionalidad"},{"id":"w0","text":"Sí: todo va como descuento definitivo"},{"id":"w1","text":"No: ningún IVA puede descontarse"}],"answer":"ok","hint":"Un gasto puede apoyar varias clases de ventas.","explanation":"Si no puede imputarse directamente, el IVA común se distribuye según las operaciones del período. Faltan esos ingresos para cerrar la depuración.","calculation":[],"sources":["descuento","prorrata","pn"]},{"id":"b023","topic":"criterio","level":1,"type":"choice","prompt":"¿Exento y excluido significan exactamente lo mismo?","options":[{"id":"ok","text":"No: el tratamiento y los derechos asociados son distintos"},{"id":"w0","text":"Sí, porque ambos se facturan sin cobro de IVA"},{"id":"w1","text":"Sí, siempre generan devolución"}],"answer":"ok","hint":"No te quedes solo con el valor de la factura.","explanation":"Exento implica tarifa cero en los casos legales; excluido queda fuera del gravamen. El derecho a descuentos o devoluciones exige revisar las condiciones de cada régimen.","calculation":[],"sources":["descuento","prorrata","pn"]},{"id":"b024","topic":"asientos","level":0,"type":"choice","prompt":"Al causar una compra de mercancía a crédito, ¿qué aumenta?","options":[{"id":"ok","text":"Inventario y proveedores"},{"id":"w0","text":"Bancos e ingresos"},{"id":"w1","text":"Solo gastos"}],"answer":"ok","hint":"La empresa recibe un bien y adquiere una deuda.","explanation":"Se debita el inventario y se acredita el pasivo por pagar, separando los impuestos y retenciones que correspondan.","calculation":[],"sources":["puc"]},{"id":"b025","topic":"asientos","level":1,"type":"choice","prompt":"En el vendedor, la retefuente que le practicó su cliente se registra…","options":[{"id":"ok","text":"Al debe, como anticipo de renta"},{"id":"w0","text":"Al haber, como ingreso"},{"id":"w1","text":"Al debe, como pérdida"}],"answer":"ok","hint":"Ese valor podrá imputarse a su impuesto.","explanation":"Se reconoce un derecho en 135515. No disminuye por sí mismo el ingreso facturado.","calculation":[],"sources":["puc"]},{"id":"b026","topic":"asientos","level":1,"type":"choice","prompt":"El comprador paga una deuda ya registrada en proveedores. ¿Qué asiento hace?","options":[{"id":"ok","text":"Débito a proveedores y crédito a bancos"},{"id":"w0","text":"Débito a compras y crédito a ingresos"},{"id":"w1","text":"Débito a bancos y crédito a proveedores"}],"answer":"ok","hint":"La compra no debe registrarse dos veces.","explanation":"El pago cancela el pasivo y reduce bancos. El gasto o inventario ya se reconoció al causar la operación.","calculation":[],"sources":["puc"]},{"id":"b027","topic":"asientos","level":1,"type":"choice","prompt":"Un computador se compra para usarlo en la oficina. ¿Qué representa?","options":[{"id":"ok","text":"Un activo fijo"},{"id":"w0","text":"Mercancía para revender"},{"id":"w1","text":"Ingreso de la empresa"}],"answer":"ok","hint":"Importa el destino del bien.","explanation":"El equipo destinado al uso de la empresa se reconoce en propiedades, planta y equipo, no como inventario para venta.","calculation":[],"sources":["puc"]},{"id":"b028","topic":"criterio","level":2,"type":"choice","prompt":"¿Puedes calcular el costo de venta solo con el precio de venta?","options":[{"id":"ok","text":"No, falta el costo contable del inventario vendido"},{"id":"w0","text":"Sí, usando el precio sin IVA"},{"id":"w1","text":"Sí, restando las retenciones"}],"answer":"ok","hint":"Precio de venta y costo son magnitudes distintas.","explanation":"En una venta puede existir un asiento adicional de costo contra inventarios. Sin su costo no es correcto inventar el importe.","calculation":[],"sources":["descuento","prorrata","pn"]},{"id":"b029","topic":"cierre","level":1,"type":"choice","prompt":"Para el resumen de retenciones por pagar de Sembremos, ¿incluyes lo que le retuvieron sus clientes?","options":[{"id":"ok","text":"No: esas son retenciones a su favor"},{"id":"w0","text":"Sí: todas las retenciones se suman"},{"id":"w1","text":"Solo si hubo IVA"}],"answer":"ok","hint":"Distingue 2365 de 135515.","explanation":"El resumen de obligaciones incluye lo que Sembremos retuvo a terceros. Lo que le retuvieron a Sembremos pertenece a sus anticipos.","calculation":[],"sources":["puc"]},{"id":"b030","topic":"cierre","level":1,"type":"choice","prompt":"¿Las retenciones de renta e IVA se mezclan en una sola base?","options":[{"id":"ok","text":"No: se separan por impuesto y concepto"},{"id":"w0","text":"Sí: ambas son dinero retenido"},{"id":"w1","text":"Solo si tienen la misma tarifa"}],"answer":"ok","hint":"Cada retención tiene una base diferente.","explanation":"La renta suele partir de la base del pago; la reteIVA parte del IVA. Deben conservarse separados para el anexo.","calculation":[],"sources":["puc"]},{"id":"b031","topic":"cierre","level":2,"type":"choice","prompt":"¿El anexo de estas 11 operaciones garantiza por sí solo una declaración mensual completa?","options":[{"id":"ok","text":"No: puede faltar información del período"},{"id":"w0","text":"Sí: siempre coincide con el formulario completo"},{"id":"w1","text":"Sí: si el asiento cuadra"}],"answer":"ok","hint":"Un taller puede omitir otras obligaciones.","explanation":"Para declarar se requieren todos los movimientos, ajustes y obligaciones aplicables, incluida autorretención especial cuando corresponda.","calculation":[],"sources":["puc"]},{"id":"b032","topic":"criterio","level":1,"type":"choice","prompt":"¿Qué significa abono en cuenta en este contexto?","options":[{"id":"ok","text":"Reconocer contablemente una obligación a favor del tercero"},{"id":"w0","text":"Solo hacer una transferencia bancaria"},{"id":"w1","text":"Registrar una nota de estudio"}],"answer":"ok","hint":"Puede ocurrir antes del pago.","explanation":"La retención se analiza al pago o abono en cuenta, según lo que ocurra primero, bajo las condiciones del concepto aplicable.","calculation":[],"sources":["descuento","prorrata","pn"]},{"id":"b033","topic":"retenciones","level":1,"type":"choice","prompt":"En el régimen elegido, una compra general de $400.000 supera 10 UVT de 2026?","options":[{"id":"ok","text":"No: 10 UVT son $523.740"},{"id":"w0","text":"Sí: 10 UVT son $52.374"},{"id":"w1","text":"Sí: toda compra supera el umbral"}],"answer":"ok","hint":"Multiplica el valor de una UVT por diez.","explanation":"10 × $52.374 = $523.740. El ejercicio no supera ese umbral; deben revisarse agregaciones y reglas especiales si existen.","calculation":[],"sources":["bases","servicios","honorarios"]},{"id":"b034","topic":"retenciones","level":1,"type":"choice","prompt":"Una compra de combustible por $500.000 se retiene al 0,1%. Resultado:","options":[{"id":"ok","text":"$500"},{"id":"w0","text":"$5.000"},{"id":"w1","text":"$50.000"}],"answer":"ok","hint":"0,1% es 0,001.","explanation":"Para este concepto: $500.000 × 0,001 = $500.","calculation":[],"sources":["bases","servicios","honorarios"]},{"id":"b035","topic":"criterio","level":2,"type":"choice","prompt":"Si una respuesta del cuaderno y un apunte difieren, ¿qué se revisa primero?","options":[{"id":"ok","text":"Fecha, supuestos, concepto y fuente"},{"id":"w0","text":"Se conserva siempre la cifra más alta"},{"id":"w1","text":"Se elimina la pregunta"}],"answer":"ok","hint":"Una misma cifra puede describir escenarios distintos.","explanation":"Antes de comparar importes hay que igualar fecha, base, impuestos incluidos, calidad de las partes y condiciones del contrato.","calculation":[],"sources":["descuento","prorrata","pn"]},{"id":"b036","topic":"cuentas","level":0,"type":"choice","prompt":"¿Qué representa la cuenta 1105?","options":[{"id":"ok","text":"Caja"},{"id":"w0","text":"Bancos"},{"id":"w1","text":"Costos y gastos por pagar"},{"id":"w2","text":"Aportes sociales"}],"answer":"ok","hint":"Efectivo que entra o sale de la empresa.","explanation":"1105 · Caja. Efectivo que entra o sale de la empresa.","calculation":[],"sources":["puc"],"direction":"code-name"},{"id":"b037","topic":"cuentas","level":0,"type":"choice","prompt":"¿Cuál es el código de «Caja»?","options":[{"id":"ok","text":"1105"},{"id":"w0","text":"1110"},{"id":"w1","text":"2335"},{"id":"w2","text":"3115"}],"answer":"ok","hint":"Pertenece a: Activo.","explanation":"1105 es la cuenta de caja. Efectivo que entra o sale de la empresa.","calculation":[],"sources":["puc"],"direction":"name-code"},{"id":"b038","topic":"cuentas","level":0,"type":"choice","prompt":"¿Qué representa la cuenta 1110?","options":[{"id":"ok","text":"Bancos"},{"id":"w0","text":"IVA retenido a favor"},{"id":"w1","text":"Retención por arrendamientos"},{"id":"w2","text":"Actividades inmobiliarias, empresariales y de alquiler"}],"answer":"ok","hint":"Dinero disponible en cuentas bancarias.","explanation":"1110 · Bancos. Dinero disponible en cuentas bancarias.","calculation":[],"sources":["puc"],"direction":"code-name"},{"id":"b039","topic":"cuentas","level":0,"type":"choice","prompt":"¿Cuál es el código de «Bancos»?","options":[{"id":"ok","text":"1110"},{"id":"w0","text":"135517"},{"id":"w1","text":"236530"},{"id":"w2","text":"4155"}],"answer":"ok","hint":"Pertenece a: Activo.","explanation":"1110 es la cuenta de bancos. Dinero disponible en cuentas bancarias.","calculation":[],"sources":["puc"],"direction":"name-code"},{"id":"b040","topic":"cuen <script>
'use strict';
const App = (() => {
let audioCtx;

async function sonarRespuesta(correcta) {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;

    audioCtx ??= new AudioCtx();
    if (audioCtx.state === 'suspended') await audioCtx.resume();

    const inicio = audioCtx.currentTime;
    const notas = correcta ? [660, 880] : [220, 165];

    notas.forEach((frecuencia, i) => {
      const osc = audioCtx.createOscillator();
      const volumen = audioCtx.createGain();
      const t = inicio + i * 0.13;

      osc.type = 'sine';
      osc.frequency.setValueAtTime(frecuencia, t);
      volumen.gain.setValueAtTime(0, t);
      volumen.gain.linearRampToValueAtTime(0.12, t + 0.01);
      volumen.gain.exponentialRampToValueAtTime(0.001, t + 0.16);

      osc.connect(volumen);
      volumen.connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 0.18);
      osc.onended = () => {
        osc.disconnect();
        volumen.disconnect();
      };
    });
  } catch (_) {}
}

 function sessionStart(mode){const count=filteredPool().length;return `<section class="panel pad"><div class="eyebrow">${mode==='exam'?'MIDE LO QUE YA ENTIENDES':'PREPARA TU SIGUIENTE TALLER'}</div><h2 style="margin:13px 0 10px">${mode==='exam'?'Tu simulacro, a tu ritmo.':'Un poco de práctica suma.'}</h2><p class="muted" style="font-size:14px">${mode==='exam'?'Responde primero. Al terminar verás tus resultados y la explicación de cada pregunta.':'Pide una pista, comprueba y descubre por qué. Puedes salir y continuar más tarde.'}</p><div class="metric-row"><div class="metric"><strong>${Math.min(count,state.settings.length)}</strong><span>preguntas en esta sesión</span></div><div class="metric"><strong>${state.settings.levels.length}</strong><span>niveles seleccionados</span></div><div class="metric"><strong>${mode==='exam'&&state.settings.timer?state.settings.timer+'′':'∞'}</strong><span>${mode==='exam'&&state.settings.timer?'minutos':'sin prisa'}</span></div></div>${count?b(mode==='exam'?'Iniciar simulacro →':'Empezar práctica →','start-session',`data-value="${mode}"`,'primary'):'<div class="note">No hay preguntas con estos filtros. Activa otro tema o nivel; si elegiste repasar errores, puede que aún no tengas ninguno.</div>'}</section>`}

 function accountCards(query){const normal=v=>v.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();const list=data.cuentas.filter(a=>normal(a.code+' '+a.name+' '+a.classification+' '+a.description).includes(normal(query)));return list.length?list.map(a=>`<article class="account-card"><div class="between"><span class="eyebrow mono">${a.code}${a.auxiliary?' · auxiliar':''}</span><span class="pill">${a.nature==='D'?'Deudora':'Acreedora'}</span></div><strong>${esc(a.name)}</strong><span class="small" style="color:var(--purple)">${esc(a.classification)}</span><p>${esc(a.description)}</p><a class="small" href="https://puc.com.co/${a.code}" target="_blank" rel="noopener noreferrer">Consultar cuenta ↗</a></article>`).join(''):'<p class="muted">No se encontraron cuentas.</p>'}

 function activeContext(){if(state.route==='taller'){const c=currentCase(),q=c.steps[caseIndex(c)];if(!q)return {};return {q,c,answers:state.answers,a:state.answers[q.id]??={}}}if(state.route==='practica'||state.route==='simulacro'){const ss=state.route==='simulacro'?state.exam:state.practice;if(!ss||ss.done)return {};const q=findQuestion(ss.ids[ss.at]);return {q,ss,answers:ss.answers,a:ss.answers[q.id]??={}}}return {}}
 function record(q,correct){const h=state.history[q.id]??={attempts:0,correct:0,wrong:false};h.attempts++;if(correct){h.correct++;h.wrong=false}else h.wrong=true;}
 function entryErrors(c,q){const d=draftFor(q,c);return c.ledgers[q.side].map((r,i)=>({account:d[i]?.account!==r.account,side:d[i]?.side!==r.side,amount:d[i]?.amount===''||!Number.isFinite(Number(d[i]?.amount))||Number(d[i]?.amount)!==r.amount}))}
 function check(reveal=false){const {q,c,a}=activeContext();if(!q||a.resolved)return;
  if(reveal){a.resolved=true;a.correct=false;a.assisted=true;a.wrong=false;if(q.type==='choice')record(q,false);if(q.type==='entry')state.drafts[q.id]=c.ledgers[q.side].map(r=>({...r,amount:String(r.amount)}));}
  else{a.attempts=(a.attempts||0)+1;let ok;if(q.type==='entry'){const errors=entryErrors(c,q);transient.entryErrors??={};transient.entryErrors[q.id]=errors;ok=errors.every(e=>!Object.values(e).some(Boolean));}else{if(!a.selected)return;ok=a.selected===q.answer;record(q,ok)}
sonarRespuesta(ok);
a.correct=ok;a.wrong=!ok;if(ok){a.resolved=true;a.assisted=!!a.hintUsed;if(q.type==='choice'&&(a.hintUsed||a.attempts>1))state.history[q.id].wrong=true}else{a.hint=true;a.hintUsed=true;}
  }save();render();if(a.resolved)document.querySelector('[data-action="next-step"],[data-action="session-next"]')?.focus({preventScroll:true});
 }
 function startSession(mode){const ids=shuffled(filteredPool()).slice(0,state.settings.length).map(q=>q.id);if(!ids.length){toast('No hay preguntas con esos filtros.');return}const ss={ids,at:0,answers:{},done:false,seed:Date.now()>>>0,endsAt:mode==='exam'&&state.settings.timer?Date.now()+state.settings.timer*60000:null,recorded:false};state[mode==='exam'?'exam':'practice']=ss;transient={};save();render(true)}
 function finishExam(){const ss=state.exam;if(!ss||ss.done)return;ss.done=true;if(!ss.recorded){for(const id of ss.ids){const q=findQuestion(id);record(q,ss.answers[id]?.selected===q.answer)}ss.recorded=true}closeModal();save();render(true)}
 function updateTimer(){const ss=state.exam;if(!ss||ss.done||!ss.endsAt)return;const remaining=Math.max(0,Math.ceil((ss.endsAt-Date.now())/1000));if(!remaining){finishExam();toast('Tiempo terminado. Ya puedes revisar tus respuestas.');return}const el=$('examTimer');if(el)el.textContent=`${String(Math.floor(remaining/60)).padStart(2,'0')}:${String(remaining%60).padStart(2,'0')}`}
 function startMatch(){const pairs=shuffled(filteredPairs()).slice(0,5);if(pairs.length<2){toast('Activa temas con al menos dos parejas.');return}state.match={ids:pairs.map(p=>p.id),matched:[],errors:0,seed:Date.now()>>>0};transient={};closeModal();save();render(true)}
 function matchTile(side,id){const m=state.match;if(!m||m.matched.includes(id))return;transient.matchWrong=null;transient.matchSelection??={};transient.matchSelection[side]=id;const sel=transient.matchSelection;if(sel.left&&sel.right){sonarRespuesta(sel.left===sel.right);if(sel.left===sel.right){m.matched.push(sel.left);const p=data.parejas.find(p=>p.id===sel.left);transient.matchFeedback=`<strong class="success-text">✓ Conexión correcta</strong>${esc(p.explanation)}`;}else{m.errors++;transient.matchWrong={...sel};transient.matchFeedback='<strong class="error-text">No forman pareja todavía.</strong>Vuelve a elegir una tarjeta de cada columna.'}transient.matchSelection={};save()}render();}
 function download(name,content,type='application/json'){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
 function exportClosing(){const cs=closingRows(),lines=[['Operacion','Tercero','Concepto','Base_renta_COP','Retencion_renta_COP','Base_reteIVA_COP','Retencion_IVA_COP','Neto_COP'],...cs.map(c=>[c.number,c.vendor,c.cat,c.values.base,c.values.rf,c.values.rv?c.values.vat:0,c.values.rv,c.values.net])];download('retefuente-anexo-didactico.csv','\ufeff'+lines.map(l=>l.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\r\n'),'text/csv;charset=utf-8')}
 function act(action,el){const value=el?.dataset.value;const ctx=activeContext();
  switch(action){
   case 'route':closeModal();state.route=value;transient={};save();render(true);break;
   case 'cases':openModal('cases');break;
   case 'live-notebook':openModal('notebook');break;
   case 'case':state.activeCase=value;state.route='taller';transient={};closeModal();save();render(true);break;
   case 'next-case':{const c=currentCase();state.activeCase=data.taller.cases[c.number]?.id||c.id;transient={};save();render(true);break}
   case 'next-step':if(ctx.q&&ctx.a.resolved){state.caseSteps[ctx.c.id]=caseIndex(ctx.c)+1;transient={};save();render();$('questionTitle')?.focus({preventScroll:true});document.querySelector('.card-main')?.scrollIntoView({block:'start',behavior:'auto'})}break;
   case 'previous-step':{const c=currentCase();state.caseSteps[c.id]=Math.max(0,caseIndex(c)-1);transient={};save();render();break}
   case 'restart-case':state.caseSteps[currentCase().id]=0;save();render(true);break;
   case 'retry-step':if(ctx.q){delete state.answers[ctx.q.id];delete state.drafts[ctx.q.id];transient={};save();render()}break;
   case 'select':if(ctx.q&&!ctx.a.resolved){ctx.a.selected=value;ctx.a.wrong=false;save();const id=el.id;render();$(id)?.focus({preventScroll:true})}break;
   case 'hint':if(ctx.q){ctx.a.hint=!ctx.a.hint;if(ctx.a.hint)ctx.a.hintUsed=true;save();render()}break;
   case 'check':check();break;
   case 'reveal':check(true);break;
   case 'notebook-side':state.notebookSide=value;save();render();break;
   case 'notebook-toggle':state.notebookOpen=!state.notebookOpen;save();render();break;
   case 'filter':{const field=el.dataset.field,val=field==='levels'?Number(value):value,list=state.settings[field];state.settings[field]=list.includes(val)?list.filter(v=>v!==val):[...list,val];transient.filtersOpen=true;save();render();break}
   case 'all-filters':state.settings.topics=data.config.topics.map(t=>t.id);state.settings.levels=[0,1,2];state.settings.directions=['code-name','name-code'];state.settings.onlyWrong=false;transient.filtersOpen=true;save();render();break;
   case 'start-session':startSession(value);break;
   case 'new-session':transient.newSessionMode=value;openModal('new-session');break;
   case 'confirm-new-session':state[value==='exam'?'exam':'practice']=null;closeModal();save();render(true);break;
   case 'session-next':{const ss=state.route==='simulacro'?state.exam:state.practice;if(!ss)return;if(ss.at+1<ss.ids.length)ss.at++;else ss.done=true;save();render(true);break}
   case 'session-prev':if(ctx.ss){ctx.ss.at=Math.max(0,ctx.ss.at-1);save();render(true)}break;
   case 'exam-jump':if(state.exam){state.exam.at=Number(value);save();render(true)}break;
   case 'finish-exam':openModal('finish-exam');break;
   case 'confirm-finish-exam':finishExam();break;
   case 'start-match':startMatch();break;
   case 'confirm-new-match':openModal('new-match');break;
   case 'match-tile':matchTile(el.dataset.side,value);break;
   case 'practice-errors':state.settings.topics=data.config.topics.map(t=>t.id);state.settings.levels=[0,1,2];state.settings.directions=['code-name','name-code'];state.settings.onlyWrong=true;state.practice=null;state.route='practica';transient={filtersOpen:true};save();render(true);break;
   case 'practice-closing':state.settings.topics=['cierre'];state.settings.levels=[0,1,2];state.settings.onlyWrong=false;state.practice=null;state.route='practica';save();render(true);break;
   case 'reference':state.referenceTab='reglas';openModal('reference');break;
   case 'reference-tab':state.referenceTab=value;if(modal==='reference')renderModal();else render();break;
   case 'menu':openModal('menu');break;
   case 'close-modal':closeModal();break;
   case 'confirm-reset':openModal('reset');break;
   case 'reset':state=defaults();transient={};closeModal();save();render(true);toast('El cuaderno está listo para empezar de nuevo.');break;
   case 'export-progress':download('retefuente-progreso.json',JSON.stringify({app:'retefuente-cuaderno',schemaVersion:1,exportedAt:new Date().toISOString(),state},null,2));toast('Copia de avance preparada.');break;
   case 'import-progress':$('importFile').click();break;
   case 'confirm-import':state=transient.imported;transient={};closeModal();save();render(true);toast('Avance restaurado.');break;
   case 'export-closing':exportClosing();break;
   case 'logout':try{sessionStorage.removeItem(key()+'.access')}catch(e){}unlocked=false;closeModal();render();break;
  }
 }
 document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el){e.preventDefault();act(el.dataset.action,el)}else if(e.target.dataset.overlay)closeModal()});
 document.addEventListener('submit',e=>{if(e.target.id!=='loginForm')return;e.preventDefault();if($('accessKey').value.trim().toLowerCase()===data.config.accessKey){unlocked=true;try{sessionStorage.setItem(key()+'.access','yes')}catch(e){}render(true)}else{$('loginError').textContent='La clave no coincide. Inténtalo de nuevo.';$('accessKey').focus()}});
 function handleDraft(el){const {q,c,a}=activeContext();if(!q||q.type!=='entry'||a.resolved)return;const draft=draftFor(q,c),i=Number(el.dataset.row);if(!draft[i])return;draft[i][el.dataset.draft]=el.value;save();el.classList.remove('field-error');if($('notebookBody'))$('notebookBody').innerHTML=notebookBody(c,q);if($('entryBalance'))$('entryBalance').innerHTML=entryBalance(draft);}
 document.addEventListener('input',e=>{const el=e.target;if(el.dataset.draft)handleDraft(el);if(['accountSearch','accountSearchModal'].includes(el.id)){transient.search=el.value;$(el.id==='accountSearchModal'?'accountResultsModal':'accountResults').innerHTML=accountCards(el.value)}});
 document.addEventListener('change',e=>{const el=e.target;if(el.dataset.draft)handleDraft(el);if(el.dataset.setting){state.settings[el.dataset.setting]=el.type==='checkbox'?el.checked:Number(el.value);transient.filtersOpen=true;save();render()}if(el.id==='importFile')importFile(el.files[0]);});
 async function importFile(file){if(!file)return;try{if(file.size>3000000)throw Error('La copia es demasiado grande.');const incoming=JSON.parse(await file.text());if(incoming.app!=='retefuente-cuaderno'||incoming.schemaVersion!==1)throw Error('Selecciona una copia de avance de ReteFuente.');const imported=restore(incoming.state);transient.imported=imported;openModal('import')}catch(e){toast('No se pudo importar: '+e.message)}$('importFile').value='';}
 document.addEventListener('keydown',e=>{if(!modal)return;if(e.key==='Escape'){closeModal();return}if(e.key==='Tab'){const els=[...document.querySelectorAll('.modal button:not([disabled]),.modal a,.modal input,.modal select,.modal summary')].filter(x=>x.getClientRects().length);if(!els.length)return;const first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
 async function init(){
  try{
   const names=['config','cuentas','preguntas','parejas','taller','fuentes'];
   if(location.protocol==='file:')data=JSON.parse($('offline-data').textContent);
   else{const values=await Promise.all(names.map(async n=>{const r=await fetch(new URL(`data/retefuente_${n}.json`,location.href),{cache:'no-cache'});if(!r.ok)throw Error(`No se pudo cargar data/retefuente_${n}.json (HTTP ${r.status}).`);return await r.json()}));data=Object.fromEntries(names.map((n,i)=>[n,values[i]]));}
   if(data.config.schemaVersion!==1||!Array.isArray(data.taller.cases)||!Array.isArray(data.preguntas))throw Error('El formato del banco de datos no es compatible.');
   state=defaults();try{const old=localStorage.getItem(key());if(old)state=restore(JSON.parse(old));sessionStorage.getItem(key()+'.access')==='yes'&&(unlocked=true)}catch(e){if(e.name==='SecurityError')storageOK=false;else toast('No se pudo recuperar el avance anterior. Puedes importar una copia.');}
   render();
  }catch(e){$('app').innerHTML=`<main class="login-page"><section class="panel pad" style="max-width:480px"><h1 style="font-size:25px">Falta una pieza del cuaderno.</h1><p class="muted" style="margin:16px 0">${esc(e.message)}</p><p class="small muted">En GitHub Pages, sube el HTML junto a la carpeta data, sin cambiar sus nombres. Si lo abriste dentro de una vista previa, descarga y abre el HTML localmente.</p><button class="btn primary" style="margin-top:20px" onclick="location.reload()">Volver a intentar</button></section></main>`;}
 }
 return {init,fmt,totals,shuffled,restore,entryErrors,filteredPool,filteredPairs,questionPool,closingRows,act,check,finishExam,render,get data(){return data},get state(){return state},get transient(){return transient},_initTest(d,s){data=d;state=s||defaults();unlocked=true;return state}};
})();
