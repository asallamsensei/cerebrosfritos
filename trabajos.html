<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">

<title>Entre granos · Asallam Sensei</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230c101b'/%3E%3Cpath d='M9 6h14v4l-6 6 6 6v4H9v-4l6-6-6-6z' fill='none' stroke='%23e8c178' stroke-width='2'/%3E%3C/svg%3E">
<style>
:root{color-scheme:dark;--bg:#0b1020;--text:#f2f1ff;--muted:#a0abc4;--gold:#bca6ff;--line:#ffffff18}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:radial-gradient(ellipse at 35% 40%,#25244b55,transparent 65%),var(--bg);color:var(--text);font-family:system-ui,sans-serif;min-height:100svh}
button,input{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible{outline:2px solid #c4b5fd;outline-offset:4px}
.shell{max-width:1000px;margin:auto;padding:24px}.topbar{display:flex;justify-content:flex-end;gap:16px;min-height:32px}
.quiet,.motion{border:0;background:none;color:var(--muted);font-size:12px;padding:7px}.quiet:hover,.motion:hover{color:white}
.login{max-width:330px;margin:24vh auto 0}.login h1{font-size:26px;text-align:center;margin:0 0 25px}.login label{display:block;font-size:12px;color:var(--muted);margin-bottom:10px}
.inputrow{display:flex;border:1px solid #ffffff29;border-radius:10px;background:#ffffff05}.inputrow input{width:100%;min-width:0;border:0;background:none;color:white;padding:14px}.inputrow button{border:0;background:none;font-size:11px;color:var(--muted);padding:10px}.primary{border:1px solid #b49aff55;background:#7d5cff35;border-radius:10px;width:100%;padding:13px;margin-top:12px}.primary:hover{background:#7d5cff55}#error{font-size:12px;min-height:18px;color:#ffacb1}
.intro h1{font-size:clamp(25px,4vw,35px);font-weight:650;text-align:center;margin:20px 0 0}.star{color:#c4b5fd;font-size:.7em;margin:0 8px}
.workspace{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;align-items:center}.clock{text-align:center;min-width:0}.stage{height:520px;max-width:580px;margin:auto}canvas{width:100%;height:100%;display:block}
.timer-label{font-size:11px;color:var(--muted);margin:0 0 10px}.digits{display:flex;justify-content:center;gap:9px}.unit{min-width:38px}.unit strong{display:block;font:24px ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums;color:#ded2ff}.unit span{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.colon{font:20px monospace;color:#6f688a}.deadline{font-size:11px;color:var(--muted);line-height:1.8;margin:17px 0 0}
.tasks{padding:23px;border:1px solid var(--line);border-radius:14px;background:#ffffff03}.task-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.task-head h2{font-size:16px;margin:0;font-weight:550}.counter{font-size:11px;color:var(--muted)}.task-list{list-style:none;padding:0;margin:0}.task-list li+li{border-top:1px solid #ffffff0b}.task-list label{display:flex;align-items:center;gap:12px;min-height:52px;cursor:pointer;font-size:14px}.task-list input{width:17px;height:17px;accent-color:#b49aff;margin:0}.task-list input:checked+span{text-decoration:line-through;color:#8690a7}.save-note{color:#e5b1b1;font-size:11px;line-height:1.5;margin-bottom:0}.save-note:empty{display:none}
@media(max-width:650px){.shell{padding:16px}.workspace{grid-template-columns:1fr;gap:28px}.stage{height:440px}.tasks{width:100%;max-width:380px;margin:0 auto 24px}.intro h1{margin-top:15px}.login{margin-top:20vh}}
</style>
</head>
<body>
<div class="shell">
 <header class="topbar"><button class="motion" id="motion" hidden aria-pressed="false">Pausar animación</button><button class="quiet" id="logout" hidden>Cambiar clave</button></header>
 <main>
  <section class="login" id="login">
   <h1>Ingresa tu clave</h1>
   <form id="access"><label for="key">Tu clave de acceso</label><div class="inputrow"><input id="key" type="password" placeholder="Escribe tu clave" autocomplete="off" autocapitalize="none" spellcheck="false" required aria-describedby="error"><button type="button" id="reveal" aria-label="Mostrar clave" aria-pressed="false">Mostrar</button></div><button class="primary" type="submit">Entrar a mi espacio <span aria-hidden="true">→</span></button><p id="error" role="alert"></p></form>
  </section>
  <section id="dashboard" hidden aria-labelledby="title">
   <div class="intro"><h1 id="title" tabindex="-1"></h1></div>
   <div class="workspace">
    <section class="clock" aria-label="Tiempo del proyecto">
     <div class="stage"><canvas id="glass" role="img" aria-label="Reloj de arena: la arena superior representa el tiempo restante."></canvas></div>
     <p class="timer-label" id="timer-label">Tiempo para tu entrega</p>
     <div class="digits" role="timer" aria-label="Tiempo restante" aria-live="off"><div class="unit"><strong id="days">00</strong><span>Días</span></div><span class="colon" aria-hidden="true">:</span><div class="unit"><strong id="hours">00</strong><span>Horas</span></div><span class="colon" aria-hidden="true">:</span><div class="unit"><strong id="minutes">00</strong><span>Min</span></div><span class="colon" aria-hidden="true">:</span><div class="unit"><strong id="seconds">00</strong><span>Seg</span></div></div>
     <p class="deadline"><time id="deadline"></time></p>
    </section>
    <aside class="tasks" aria-labelledby="tasks-title"><div class="task-head"><h2 id="tasks-title">Tareas</h2><span class="counter" id="count" aria-live="polite"></span></div><ul class="task-list" id="task-list"></ul><p class="save-note" id="save-note" role="status"></p></aside>
   </div>
  </section>
 </main>

</div>
<script>
'use strict';
/* ═════════════ PERSONALIZA SOLO ESTE BLOQUE ═════════════
   Guarda este archivo como index.html. No necesita dependencias.
   Las fechas incluyen -05:00 para mantener la hora de Colombia.
   inicio determina cuánta arena queda: NO se reinicia al abrir la página.
   IMPORTANTE: estas claves seleccionan una vista; NO son autenticación
   segura. El código de un sitio estático es visible para sus visitantes.
   Los checks son locales, no se sincronizan entre usuarios/dispositivos.
*/
const PROYECTOS = {
  referencias: {
    id: 'gabriela', trabajo: 'Referencias', nombre: 'Gabriela',
    inicio: '2026-10-07T00:00:00-05:00', fin: '2026-10-14T23:59:00-05:00',
    items: [
     {id:'g1', texto:'Automatizar las referencias', listo:false},
     {id:'g2', texto:'Revisar una por una', listo:false},
     {id:'g3', texto:'Cuadrar las citas', listo:false},
     {id:'g4', texto:'Reescribir lo necesario', listo:false},
     {id:'g5', texto:'Detalles finales', listo:false}
    ]
  },
  'por fin': {
    id: 'alexis', trabajo: 'Tesis', nombre: 'Alexis',
    inicio: '2026-10-07T00:00:00-05:00', fin: '2026-10-21T23:59:00-05:00',
    items: [
     {id:'g1', texto:'Cuadrar las referencias', listo:false},
     {id:'g2', texto:'Corregir el documento', listo:false},
     {id:'g3', texto:'Ampliar el documento', listo:false},
     {id:'g4', texto:'Completar lo que falte', listo:false},
     {id:'g5', texto:'Detalles finales', listo:false}
    ]
  }
};
/* ═════════════ FIN DE LA CONFIGURACIÓN ═════════════ */
const $ = id => document.getElementById(id);
const reduced = matchMedia('(prefers-reduced-motion: reduce)');
let project=null, checked={}, paused=reduced.matches, frame=0, lastFrame=0, remaining=1;
const canvas=$('glass'), ctx=canvas.getContext('2d');
const clamp=v=>Math.max(0,Math.min(1,v));
function timing(p,now=Date.now()){
 const start=Date.parse(p.inicio), end=Date.parse(p.fin);
 return {left:Math.max(0,end-now),ratio:clamp((end-now)/(end-start)),active:now>=start&&now<end};
}
function storageKey(){return 'entre-granos:v1:'+project.id;}
function updateTasks(){
 const n=project.items.filter(item=>checked[item.id]===true).length, total=project.items.length;
 $('count').textContent=`${n} / ${total}`;
}
function openProject(p){
 project=p;checked={};
 try{const saved=JSON.parse(localStorage.getItem(storageKey())||'{}');if(saved&&typeof saved==='object'&&!Array.isArray(saved))checked=saved;}catch{}
 $('save-note').textContent='';particles.length=0;emitCarry=0;
 $('title').replaceChildren(document.createTextNode(p.trabajo+' '));
 const star=document.createElement('span');star.className='star';star.textContent='★';$('title').append(star,document.createTextNode(' '+p.nombre));
 document.title=`${p.trabajo} ★ ${p.nombre} · Entre granos`;
 $('task-list').replaceChildren();
 p.items.forEach(item=>{const li=document.createElement('li'),label=document.createElement('label'),input=document.createElement('input'),span=document.createElement('span');
 input.type='checkbox';
 input.checked = checked[item.id] = item.listo === true;
 input.disabled = true;
 span.textContent=item.texto;
 input.addEventListener('change',()=>{checked[item.id]=input.checked;try{localStorage.setItem(storageKey(),JSON.stringify(checked));}catch{$('save-note').textContent='El navegador no permite guardar. Las marcas durarán mientras mantengas esta página abierta.';}updateTasks();});
 label.append(input,span);li.append(label);$('task-list').append(li);});
 const date=new Date(p.fin);$('deadline').dateTime=p.fin;
 $('deadline').textContent=new Intl.DateTimeFormat('es-CO',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'America/Bogota'}).format(date)+' · '+new Intl.DateTimeFormat('es-CO',{hour:'numeric',minute:'2-digit',hour12:true,timeZone:'America/Bogota'}).format(date)+' (Colombia)';
 $('login').hidden=true;$('dashboard').hidden=false;$('logout').hidden=false;$('motion').hidden=false;
 $('key').value='';$('key').type='password';$('reveal').textContent='Mostrar';$('reveal').setAttribute('aria-label','Mostrar clave');$('reveal').setAttribute('aria-pressed','false');$('error').textContent='';
 updateTasks();updateTime();resize();restart();$('title').focus();
}
$('access').addEventListener('submit',e=>{e.preventDefault();const key=$('key').value.trim().toLowerCase();
 if(!Object.hasOwn(PROYECTOS,key)){$('error').textContent='Esa clave no coincide. Revísala e inténtalo otra vez.';$('key').setAttribute('aria-invalid','true');return;}
 $('key').removeAttribute('aria-invalid');openProject(PROYECTOS[key]);});
$('key').addEventListener('input',()=>{$('error').textContent='';$('key').removeAttribute('aria-invalid');});
$('reveal').addEventListener('click',()=>{const show=$('key').type==='password';$('key').type=show?'text':'password';$('reveal').textContent=show?'Ocultar':'Mostrar';$('reveal').setAttribute('aria-label',show?'Ocultar clave':'Mostrar clave');$('reveal').setAttribute('aria-pressed',String(show));});
$('logout').addEventListener('click',()=>{project=null;cancelAnimationFrame(frame);$('dashboard').hidden=true;$('login').hidden=false;$('logout').hidden=true;$('motion').hidden=true;document.title='Entre granos · Asallam Sensei';$('key').focus();});
function updateTime(){if(!project)return;
 const t=timing(project);remaining=t.ratio;let s=Math.ceil(t.left/1000);
 const values=[Math.floor(s/86400),Math.floor(s%86400/3600),Math.floor(s%3600/60),s%60];
 ['days','hours','minutes','seconds'].forEach((id,i)=>$(id).textContent=String(values[i]).padStart(2,'0'));
 $('timer-label').textContent=t.left===0?'El plazo ha terminado':Date.now()<Date.parse(project.inicio)?'Tiempo hasta la entrega':'Tiempo para tu entrega';
 canvas.setAttribute('aria-label',`Reloj de arena: queda ${(remaining*100).toFixed(1)} % del plazo. ${values[0]} días, ${values[1]} horas, ${values[2]} minutos y ${values[3]} segundos.`);
 if(paused||!t.active)draw(0);
}
setInterval(updateTime,1000);
/* ARENA TORNASOL
   Cada 180 ms, cada grano tiene estas probabilidades:
   70%: acercarse al color de un vecino; 25%: variar un poco; 5%: otro tono.
   Se usa una copia del estado anterior para que todos cambien a la vez.
   Los colores se interpolan suavemente: no hay parpadeos bruscos.
   La caída es decorativa; el volumen de arena sigue el plazo real.
*/
const PALETA=[175,195,225,260,285,320,345,40];
const COLS=41,ROWS=33,STEP=4.4,grains=[],particles=[];
let colorClock=0,emitCarry=0,visualTime=0;
function rand(i){const n=Math.sin(i*127.1+311.7)*43758.5453;return n-Math.floor(n);}
function halfWidth(y){return 5+83*Math.pow(Math.cos(clamp((y-58)/140)*Math.PI/2),1.15);}
const slices=280,area=[0];for(let i=0;i<slices;i++)area.push(area[i]+2*halfWidth(58+(i+.5)*140/slices)*140/slices);
function surface(f){const target=(1-clamp(f))*area[slices];let i=0;while(i<slices&&area[i]<target)i++;return 58+i*140/slices;}
function chamber(bottom=false){ctx.beginPath();for(let i=0;i<=slices;i++){const y=58+i*140/slices,x=200-halfWidth(y),yy=bottom?400-y:y;i?ctx.lineTo(x,yy):ctx.moveTo(x,yy);}for(let i=slices;i>=0;i--){const y=58+i*140/slices;ctx.lineTo(200+halfWidth(y),bottom?400-y:y);}ctx.closePath();}
for(let side=0;side<2;side++)for(let row=0;row<ROWS;row++)for(let col=0;col<COLS;col++){
 const hue=PALETA[Math.floor((col/8+row/7+side*2))%PALETA.length];
 grains.push({side,row,col,x:112+col*STEP+(rand(row*COLS+col)-.5)*2.8,y:58+row*STEP+(rand(row*73+col+41)-.5)*2.6,hue,target:hue,size:2.7+rand(row*51+col+99)*1.3});
}
function hueDelta(a,b){return ((b-a+540)%360)-180;}
function evolveColors(dt){
 colorClock+=dt;
 if(colorClock>=.18){colorClock%=.18;const old=grains.map(g=>g.target);
  grains.forEach((g,i)=>{const r=Math.random();if(r<.7){
   const [dc,dr]=[[1,0],[-1,0],[0,1],[0,-1]][Math.floor(Math.random()*4)];
   const c=Math.max(0,Math.min(COLS-1,g.col+dc)),r2=Math.max(0,Math.min(ROWS-1,g.row+dr));
   const near=old[g.side*COLS*ROWS+r2*COLS+c];g.target=(old[i]+hueDelta(old[i],near)*.65+360)%360;
  }else if(r<.95)g.target=(old[i]+(Math.random()-.5)*24+360)%360;
  else g.target=PALETA[Math.floor(Math.random()*PALETA.length)];});
 }
 const mix=1-Math.exp(-dt*3);for(const g of grains)g.hue=(g.hue+hueDelta(g.hue,g.target)*mix+360)%360;
}
function newParticle(){
 // El grano que sale toma el color de un grano situado junto al cuello.
 const neighbor=grains[(ROWS-2)*COLS+Math.floor(COLS/2)+(Math.random()<.5?0:1)];
 particles.push({x:200+(Math.random()-.5)*5,y:195,vx:(Math.random()-.5)*5,vy:36+Math.random()*25,hue:(neighbor.hue+(Math.random()<.25?(Math.random()-.5)*90:0)+360)%360,size:2.5+Math.random()*2,age:0,landed:false,life:.45+Math.random()*.2});
}
function simulate(dt){
 visualTime+=dt;evolveColors(dt);
 if(!timing(project).active){particles.length=0;return;}
 emitCarry+=dt*42;while(emitCarry>=1){emitCarry--;if(particles.length<95)newParticle();}
 const floor=400-surface(remaining);
 for(let i=particles.length-1;i>=0;i--){const p=particles[i];
  p.vy+=dt*200;p.x+=p.vx*dt;p.y+=p.vy*dt;
  // Un cambio suave hacia el tono del grano más próximo en la caída.
  const near=particles[i?i-1:Math.min(1,particles.length-1)];
  if(near)p.hue=(p.hue+hueDelta(p.hue,near.hue)*dt*.9+360)%360;
  if(!p.landed&&p.y>=floor-2){p.landed=true;p.y=floor-2;p.vy=-20-Math.random()*19;p.vx=(Math.random()-.5)*35;}
  if(p.landed){p.age+=dt;if(p.age>=p.life)particles.splice(i,1);}
 }
}
function pixel(x,y,size,hue,alpha=1,glow=0){
 ctx.globalAlpha=alpha;ctx.fillStyle=`hsl(${hue},85%,75%)`;ctx.shadowColor=`hsl(${hue},95%,68%)`;ctx.shadowBlur=glow;
 ctx.fillRect(x-size/2,y-size/2,size,size);ctx.shadowBlur=0;
}
function sand(bottom,fraction){if(fraction<=0)return;const sy=bottom?400-surface(1-fraction):surface(fraction);
 ctx.save();chamber(bottom);ctx.clip();ctx.beginPath();ctx.rect(108,sy,184,bottom?342-sy:198-sy);ctx.clip();
 ctx.fillStyle='#312b4c';ctx.fillRect(108,58,184,284);
 const offset=bottom?COLS*ROWS:0;
 for(let i=offset;i<offset+COLS*ROWS;i++){const g=grains[i],y=bottom?400-g.y:g.y;
  if(y<sy-3||(bottom?y>344:y>200))continue;
  const shimmer=.68+.2*Math.sin(visualTime*1.3+g.col*.38+g.row*.23);
  pixel(g.x,y,g.size,g.hue,shimmer);
  // Pocos puntos luminosos: misma idea del halo de .px.gold del ejemplo.
  if(i%83===0){const a=Math.pow(Math.max(0,Math.sin(visualTime*1.8+i)),6);pixel(g.x,y,g.size*.75,g.hue,a,7);}
 }
 ctx.restore();
}
function draw(){if(!project||!ctx)return;ctx.clearRect(0,0,400,400);
 ctx.save();
 ctx.strokeStyle='#b9b4d43b';ctx.lineWidth=2;for(const x of [97,303]){ctx.beginPath();ctx.moveTo(x,48);ctx.lineTo(x,351);ctx.stroke();}
 for(const b of [false,true]){chamber(b);const glass=ctx.createLinearGradient(112,0,288,0);glass.addColorStop(0,'#c6d2ff18');glass.addColorStop(.5,'#c6d2ff02');glass.addColorStop(1,'#c6d2ff15');ctx.fillStyle=glass;ctx.fill();}
 sand(false,remaining);sand(true,1-remaining);
 ctx.save();
 // Un solo recorte para ambos bulbos y el cuello: no se escapan granos.
 ctx.beginPath();ctx.moveTo(112,58);for(let i=0;i<=slices;i++){const y=58+i*140/slices;ctx.lineTo(200-halfWidth(y),y);}
 for(let i=slices;i>=0;i--){const y=58+i*140/slices;ctx.lineTo(200-halfWidth(y),400-y);}
 for(let i=0;i<=slices;i++){const y=58+i*140/slices;ctx.lineTo(200+halfWidth(y),400-y);}
 for(let i=slices;i>=0;i--){const y=58+i*140/slices;ctx.lineTo(200+halfWidth(y),y);}ctx.closePath();ctx.clip();
 for(const p of particles){const fade=p.landed?1-p.age/p.life:1,size=p.size*(p.landed?.4+.6*fade:1);
  if(!p.landed)for(let trail=3;trail>0;trail--)pixel(p.x-p.vx*.012*trail,p.y-p.vy*.012*trail,size*.7,p.hue,.09*(4-trail));
  pixel(p.x,p.y,size,p.hue,fade,7);if(p.size>3.7)pixel(p.x,p.y,size*.36,p.hue,fade);
 }
 ctx.restore();
 ctx.strokeStyle='#d0c9f377';ctx.lineWidth=1.1;for(const b of [false,true]){chamber(b);ctx.stroke();}
 ctx.strokeStyle='#dcd5ff33';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(122,72);ctx.bezierCurveTo(128,115,153,148,174,172);ctx.moveTo(278,328);ctx.bezierCurveTo(274,290,248,255,228,235);ctx.stroke();
 const metal=ctx.createLinearGradient(88,0,312,0);metal.addColorStop(0,'#4d4c69');metal.addColorStop(.28,'#c4bbdf');metal.addColorStop(.52,'#78748e');metal.addColorStop(.78,'#b2a9cf');metal.addColorStop(1,'#4d4c69');ctx.fillStyle=metal;
 for(const y of [43,347]){ctx.beginPath();ctx.roundRect(89,y,222,9,4);ctx.fill();}
 ctx.restore();
}
function resize(){if(!project)return;const rect=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);
 // Ajuste al cristal, no al lienzo: el reloj también se ve grande en móvil.
 const scale=Math.min(canvas.width/270,canvas.height/340);ctx?.setTransform(scale,0,0,scale,canvas.width/2-200*scale,canvas.height/2-200*scale);draw();}
function animate(t){frame=0;if(!project||paused||document.hidden)return;const elapsed=t-lastFrame;if(elapsed>=1000/30){const dt=lastFrame?Math.min(elapsed/1000,.065):1/30;lastFrame=t;simulate(dt);draw();}frame=requestAnimationFrame(animate);}
function restart(){cancelAnimationFrame(frame);frame=0;lastFrame=0;$('motion').textContent=paused?'Animar arena':'Pausar animación';$('motion').setAttribute('aria-pressed',String(paused));if(project){draw();if(!paused&&!document.hidden)frame=requestAnimationFrame(animate);}}
$('motion').addEventListener('click',()=>{paused=!paused;restart();});reduced.addEventListener('change',e=>{paused=e.matches;restart();});
document.addEventListener('visibilitychange',()=>{if(project)updateTime();restart();});window.addEventListener('resize',resize);
</script>
</body>
</html>
